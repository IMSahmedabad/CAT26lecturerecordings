<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>IMS Gujarat — Lecture Recordings</title>
<style>
*{box-sizing:border-box;margin:0;padding:0}
body{font-family:'Segoe UI',Arial,sans-serif;background:#f4f3ef;min-height:100vh;color:#1a1a2e}
.topbar{background:#fff;border-bottom:1px solid #e8e8e8;padding:0 24px;height:64px;display:flex;align-items:center;gap:14px;position:sticky;top:0;z-index:100}
.topbar-logo{height:48px;width:auto;display:block}
.topbar-brand{font-size:15px;font-weight:600;color:#1a1a2e}
.topbar-brand span{color:#888;font-weight:400}

.page{max-width:720px;margin:0 auto;padding:48px 24px}

.home-title{font-size:20px;font-weight:600;color:#1a1a2e;margin-bottom:4px}
.home-sub{font-size:13px;color:#777;margin-bottom:28px}
.subjects{display:grid;grid-template-columns:repeat(auto-fit,minmax(120px,1fr));gap:12px}
.sc{background:#fff;border:1px solid #e8e8e8;border-radius:10px;padding:16px 14px;cursor:pointer;display:flex;flex-direction:column;gap:8px;transition:border-color 0.15s,box-shadow 0.15s}
.sc:hover{border-color:#bbb;box-shadow:0 2px 8px rgba(0,0,0,0.07)}
.si{width:36px;height:36px;border-radius:8px;display:flex;align-items:center;justify-content:center;flex-shrink:0}
.si svg{width:18px;height:18px}
.sn{font-size:13px;font-weight:600;color:#1a1a2e}
.sk{font-size:11px;color:#999}
.sa{font-size:13px;color:#bbb;margin-top:4px}

.rv{display:none}
.br{display:flex;align-items:center;gap:6px;margin-bottom:20px;cursor:pointer;color:#888;font-size:13px;border:none;background:none;font-family:inherit;padding:0}
.br:hover{color:#1a1a2e}
.rt{font-size:20px;font-weight:600;color:#1a1a2e;margin-bottom:3px;display:flex;align-items:center;gap:8px}
.rt svg{width:20px;height:20px}
.rs{font-size:12px;color:#999;margin-bottom:18px}
.srch{width:100%;padding:9px 13px;border:1px solid #ddd;border-radius:8px;font-size:13px;font-family:inherit;color:#1a1a2e;background:#fff;outline:none;margin-bottom:14px;transition:border-color 0.2s}
.srch:focus{border-color:#999}
.cnt{font-size:12px;color:#aaa;margin-bottom:10px}
.grid{display:flex;flex-direction:column;gap:8px}
.card{background:#fff;border:1px solid #e8e8e8;border-radius:10px;padding:14px 18px;display:flex;align-items:center;gap:16px;transition:border-color 0.15s}
.card:hover{border-color:#ccc}
.db{display:flex;flex-direction:column;align-items:center;min-width:44px;padding:7px 6px;border-radius:8px;flex-shrink:0;text-align:center}
.dd{font-size:20px;font-weight:600;line-height:1}
.dm{font-size:10px;font-weight:600;letter-spacing:0.07em;text-transform:uppercase;margin-top:2px;opacity:0.65}
.cb{flex:1;min-width:0}
.ct{font-size:14px;font-weight:600;color:#1a1a2e;margin-bottom:4px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.cf{font-size:11px;color:#aaa}
.ca{display:flex;align-items:center;gap:8px;flex-shrink:0}
.bw{padding:8px 16px;border-radius:7px;font-size:12px;font-weight:600;display:flex;align-items:center;gap:5px;white-space:nowrap;border:none;cursor:pointer;font-family:inherit;text-decoration:none;color:#fff}
.bw svg{width:13px;height:13px}
.bm{padding:8px 11px;background:#f4f3ef;color:#666;border-radius:7px;font-size:12px;font-weight:600;display:flex;align-items:center;gap:5px;border:1px solid #e0e0e0;cursor:pointer;font-family:inherit;text-decoration:none;white-space:nowrap}
.bm svg{width:13px;height:13px}
.bm:hover{background:#eae9e5}
.state{text-align:center;padding:60px 0;color:#bbb;font-size:14px}

@media(max-width:540px){
  .subjects{grid-template-columns:repeat(2,1fr)}
  .sc:last-child:nth-child(odd){grid-column:1/-1}
  .ct{white-space:normal}
  .ca{flex-wrap:wrap;justify-content:flex-end}
  .page{padding:28px 16px}
}
</style>
</head>

<div class="page">
  <div id="hv">
    <div class="home-title">What would you like to study?</div>
    <div class="home-sub">Choose a subject to browse all recorded sessions.</div>
    <div class="subjects" id="sg"></div>
  </div>

  <div class="rv" id="rv">
    <button class="br" onclick="goHome()">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M19 12H5M12 5l-7 7 7 7"/></svg>
      All subjects
    </button>
    <div class="rt" id="rt"></div>
    <div class="rs" id="rs"></div>
    <input class="srch" id="srch" type="text" placeholder="Search sessions…" oninput="renderRecs()"/>
    <div class="cnt" id="cnt"></div>
    <div class="grid" id="grid"></div>
  </div>
</div>

<script>
const SCRIPT_URL = 'https://script.google.com/macros/s/AKfycbx7DGF0DcP-3CCBhraWUZxoM0TlYGFwmWXKGqeiBTkK6KB1gogkZPhLqJF04R2XpxXc4A/exec';

const SUBJECTS = [
  {id:'VARC', name:'VARC', bg:'#E6F1FB', ic:'#185FA5',
   svg:'<path d="M4 19.5A2.5 2.5 0 0 1 6.5 17H20"/><path d="M6.5 2H20v20H6.5A2.5 2.5 0 0 1 4 19.5v-15A2.5 2.5 0 0 1 6.5 2z"/>'},
  {id:'QA', name:'QA', bg:'#FAEEDA', ic:'#854F0B',
   svg:'<line x1="4" y1="6" x2="20" y2="6"/><line x1="4" y1="10" x2="20" y2="10"/><line x1="4" y1="14" x2="11" y2="14"/><line x1="4" y1="18" x2="9" y2="18"/><polyline points="15 14 18 17 22 12"/>'},
  {id:'DILR', name:'DILR', bg:'#EAF3DE', ic:'#3B6D11',
   svg:'<path d="M3 3v18h18"/><path d="M7 16l4-4 4 4 4-6"/>'},
  {id:'Value Added', name:'Value Added', bg:'#FBEAF0', ic:'#993556',
   svg:'<polygon points="12 2 15.09 8.26 22 9.27 17 14.14 18.18 21.02 12 17.77 5.82 21.02 7 14.14 2 9.27 8.91 8.26 12 2"/>'},
  {id:'ADMAT sessions', name:'ADMAT sessions', bg:'#EEEDFE', ic:'#534AB7',
   svg:'<path d="M22 10L12 5 2 10l10 5 10-5z"/><path d="M6 12v5c3 2 9 2 12 0v-5"/>'},
];

let activeSubject = null;
let allRecs = [];

function goHome(){
  document.getElementById('hv').style.display = 'block';
  document.getElementById('rv').style.display = 'none';
  activeSubject = null;
}

function openSubject(id){
  activeSubject = id;
  const s = SUBJECTS.find(x => x.id === id);
  document.getElementById('hv').style.display = 'none';
  document.getElementById('rv').style.display = 'block';
  document.getElementById('srch').value = '';
  const cnt = allRecs.filter(r => r.subject === id).length;
  document.getElementById('rt').innerHTML =
    `<svg viewBox="0 0 24 24" fill="none" stroke="${s.ic}" stroke-width="2" width="20" height="20">${s.svg}</svg>${s.name}`;
  document.getElementById('rs').textContent = cnt + ' recorded session' + (cnt !== 1 ? 's' : '');
  renderRecs();
}

function buildHome(){
  document.getElementById('sg').innerHTML = SUBJECTS.map(s => {
    const cnt = allRecs.filter(r => r.subject === s.id).length;
    return `<div class="sc" onclick="openSubject('${s.id}')">
      <div class="si" style="background:${s.bg}">
        <svg viewBox="0 0 24 24" fill="none" stroke="${s.ic}" stroke-width="2">${s.svg}</svg>
      </div>
      <div class="sn">${s.name}</div>
      <div class="sk">${cnt} session${cnt !== 1 ? 's' : ''}</div>
      <div class="sa">→</div>
    </div>`;
  }).join('');
}

function renderRecs(){
  const q = (document.getElementById('srch').value || '').toLowerCase();
  const s = SUBJECTS.find(x => x.id === activeSubject);
  const list = allRecs.filter(r => r.subject === activeSubject && (!q || r.topic.toLowerCase().includes(q)));
  document.getElementById('cnt').textContent = list.length + ' session' + (list.length !== 1 ? 's' : '');
  if(!list.length){
    document.getElementById('grid').innerHTML = '<div class="state">No sessions match your search.</div>';
    return;
  }
  document.getElementById('grid').innerHTML = list.map(r => {
    const d = new Date(r.date);
    const day = isNaN(d) ? '—' : d.getDate();
    const mon = isNaN(d) ? '' : d.toLocaleString('en-IN',{month:'short'}).toUpperCase();
    const mb = r.material
      ? `<a class="bm" href="${esc(r.material)}" target="_blank" rel="noopener">
           <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M14 2H6a2 2 0 0 0-2 2v16a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2V8z"/><polyline points="14 2 14 8 20 8"/></svg>
           Material
         </a>` : '';
    const wb = r.link
      ? `<a class="bw" href="${esc(r.link)}" target="_blank" rel="noopener" style="background:${s.ic}">
           <svg viewBox="0 0 24 24" fill="currentColor"><polygon points="5 3 19 12 5 21 5 3"/></svg>
           Watch
         </a>` : '';
    return `<div class="card">
      <div class="db" style="background:${s.bg}">
        <div class="dd" style="color:${s.ic}">${day}</div>
        <div class="dm" style="color:${s.ic}">${mon}</div>
      </div>
      <div class="cb">
        <div class="ct">${esc(r.topic)}</div>
        <div class="cf">${esc(r.faculty || '')}</div>
      </div>
      <div class="ca">${mb}${wb}</div>
    </div>`;
  }).join('');
}

function esc(s){
  return String(s||'').replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;');
}

function jsonp(url){
  const old = document.getElementById('_js');
  if(old) old.remove();
  const el = document.createElement('script');
  el.id = '_js'; el.src = url;
  el.onerror = () => {
    document.getElementById('sg').innerHTML = '<div class="state">Could not load recordings. Please refresh.</div>';
  };
  document.head.appendChild(el);
}

window.recordingsCb = function(data){
  if(data.success && data.recordings){
    allRecs = data.recordings;
  }
  buildHome();
};

jsonp(SCRIPT_URL + '?action=recordings&cb=recordingsCb');
buildHome();
</script>
